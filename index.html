<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P13 Map Editor</title>
<meta name="description" content="Браузерный редактор карт топлива и зажигания для ЭБУ Honda Prelude P13 (OKI M66911): открыть .bin, изменить, скачать с исправленной контрольной суммой.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a7286'/%3E%3Cpath d='M6 24 L12 14 L17 19 L26 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: instrument-panel tool — top status bar, table index on the left, editor on the right; stacks on phones. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunken:#e4e9ee; --ink:#15202a; --muted:#5a6976; --line:#d2dae1;
  --accent:#0a7286; --accent-ink:#ffffff; --changed:#c77800; --ref:#7a4fd0; --bad:#c0392b; --good:#1f8a4c;
  --heat-s:78%; --heat-l:72%; --heat-ink:#10181f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#161e26; --sunken:#0b1116; --ink:#e3eaf0; --muted:#8c9ba8; --line:#27333e;
  --accent:#35bdd2; --accent-ink:#06222a; --changed:#f0a531; --ref:#a98bf0; --bad:#ef6b5b; --good:#4cc683;
  --heat-s:55%; --heat-l:34%; --heat-ink:#f2f6f9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#161e26; --sunken:#0b1116; --ink:#e3eaf0; --muted:#8c9ba8; --line:#27333e;
  --accent:#35bdd2; --accent-ink:#06222a; --changed:#f0a531; --ref:#a98bf0; --bad:#ef6b5b; --good:#4cc683;
  --heat-s:55%; --heat-l:34%; --heat-ink:#f2f6f9; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

header.bar{flex:0 0 auto;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand span{font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.file{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 260px}
.file .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-data);font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--sunken);white-space:nowrap}
.pill.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent);color:var(--good)}
.pill.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.pill.chg{border-color:color-mix(in srgb,var(--changed) 60%,transparent);color:var(--changed)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:3px 9px;font-size:13px}
label.btn input{display:none}

main.wrap{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:0}
section.pane{overflow:auto}
@media (max-width:820px){body{display:block;height:auto} main.wrap{grid-template-columns:minmax(0,1fr)} aside.index{max-height:45vh;border-right:0;border-bottom:1px solid var(--line)} section.pane{overflow:visible}}
aside.index{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:0}
.search{padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.list{overflow:auto;padding:4px 0 16px}
.grp{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
button.grp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
button.grp:hover{color:var(--ink)}
button.grp .chev{display:inline-block;width:10px;transition:transform .15s;font-family:var(--f-data)}
button.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
button.grp .cnt{margin-left:auto;font-family:var(--f-data);font-size:11px;letter-spacing:0;text-transform:none;display:flex;gap:6px;align-items:center}
button.grp.const{color:var(--accent)}
.listtools{display:flex;gap:6px;justify-content:flex-end;font-size:12px}
.listtools button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.listtools button:hover{color:var(--ink)}
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 16px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--sunken)}
.item[aria-current="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);border-left-color:var(--accent)}
.item .ad{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.item .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mk{font-size:11px;font-family:var(--f-data);display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.chg{background:var(--changed)} .dot.ref{background:var(--ref)}
.conf{color:var(--muted)}

section.pane{min-width:0;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.titlebar h1{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.titlebar .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-top:6px}
.titlebar .note{margin-top:8px;max-width:72ch;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tools .sep{width:1px;align-self:stretch;background:var(--line)}
.tools input[type=number]{width:90px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.tools .hint{color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto;max-width:100%}
table.grid{border-collapse:separate;border-spacing:2px;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:12.5px;user-select:none}
table.grid th{font-weight:600;color:var(--muted);padding:3px 6px;text-align:right;white-space:nowrap;font-size:11.5px}
table.grid thead th{text-align:center}
table.grid td{min-width:44px;height:28px;text-align:center;border-radius:3px;cursor:cell;position:relative;color:var(--heat-ink);padding:0 4px}
table.grid td.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
table.grid td.cur{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
table.grid td.chg::after,table.pts td.chg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--changed);box-shadow:0 0 0 1px var(--surface)}
table.grid td.rdf::before,table.pts td.rdf::before{content:"";position:absolute;bottom:2px;left:2px;width:6px;height:6px;border-radius:1px;background:var(--ref);box-shadow:0 0 0 1px var(--surface)}
table.grid td input,table.pts td input{width:100%;height:100%;border:0;text-align:center;background:var(--surface);color:var(--ink);font:inherit;padding:0}
.axisnote{color:var(--muted);font-size:12.5px}
.split{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
table.pts{border-collapse:collapse;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:13px}
table.pts th{font-size:11.5px;color:var(--muted);text-align:right;padding:4px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.pts td{padding:0;height:28px;min-width:76px;text-align:right;border-bottom:1px solid var(--line);position:relative}
table.pts td.ro{color:var(--muted);padding:0 10px}
table.pts td.ed{cursor:text}
table.pts td.ed span{display:block;padding:0 10px}
table.pts td.ed:hover{background:var(--sunken)}
table.pts tr.hd td{color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.chart svg{display:block;width:100%;height:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.panel h2{font-family:var(--f-display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;color:var(--muted);font-weight:600}
.changes{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.changes button{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px;text-align:left;border:0;background:transparent;padding:4px 6px;border-radius:4px;cursor:pointer}
.changes button:hover{background:var(--sunken)}
.changes .ad{font-family:var(--f-data);color:var(--muted);font-size:12px}
.changes .n{font-family:var(--f-data);color:var(--changed);font-size:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:36px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--surface);max-width:760px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.drop h1{font-family:var(--f-display);font-size:34px;margin:0;line-height:1.05}
.drop p{margin:0;color:var(--muted);max-width:64ch}
.drop ul{margin:0;padding-left:18px;color:var(--muted)}
.drop a{color:var(--accent)}
.msg{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);max-width:760px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.msg.warn{border-color:var(--changed)}
.hexwrap{font-family:var(--f-data);font-size:12.5px}
table.hex{border-collapse:separate;border-spacing:1px}
table.hex th{color:var(--muted);font-weight:600;font-size:11.5px;padding:2px 6px;text-align:right}
table.hex td{width:30px;height:24px;text-align:center;position:relative;cursor:text;border-radius:2px}
table.hex td:hover{background:var(--sunken)}
table.hex td.chg{color:var(--changed);font-weight:600}
table.hex td input{width:30px;height:24px;border:0;text-align:center;background:var(--surface);color:var(--ink);font:inherit;padding:0}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;max-width:min(420px,calc(100vw - 32px));z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.legend .ramp{width:140px;height:10px;border-radius:3px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toggle{display:flex;gap:8px;align-items:center;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>P13 Map Editor</b><span>OKI M66911 · 32K</span></div>
  <div class="file"><span class="name" id="fname">Файл не загружен</span><div class="pills" id="pills"></div></div>
  <div class="actions">
    <label class="btn" for="fileIn">Открыть .bin<input type="file" id="fileIn" accept=".bin,.BIN,application/octet-stream"></label>
    <label class="btn" for="refIn" id="refLbl">Эталон для сравнения<input type="file" id="refIn" accept=".bin,.BIN,application/octet-stream"></label>
    <button class="btn" id="undoBtn" disabled title="Ctrl+Z">Отменить</button>
    <button class="btn" id="redoBtn" disabled title="Ctrl+Shift+Z">Повторить</button>
    <button class="btn primary" id="saveBtn" disabled>Скачать прошивку</button>
  </div>
</header>

<main class="wrap">
  <aside class="index" aria-label="Список таблиц">
    <div class="search">
      <input type="search" id="q" placeholder="Поиск: адрес или название (например 63F8, VTEC)">
      <div class="filters" id="filters">
        <button class="chip" data-f="main" aria-pressed="false">Основные</button>
        <button class="chip" data-f="chg" aria-pressed="false">Изменённые</button>
        <button class="chip" data-f="ref" aria-pressed="false">Отличия от эталона</button>
      </div>
      <div class="listtools"><button id="expAll">Развернуть все</button><button id="colAll">Свернуть все</button></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="pane" id="pane"></section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";

const CATALOG = [{"a":3105,"f":"w","n":2,"x":"","g":"4. VTEC и ограничитель оборотов","t":"Ограничитель оборотов: начальный порог возобновления (в коде)","c":"✔","d":"операнд MOV 0x16C,#imm в инициализации (0x0C1E); стоково 250 = 7500 об/мин. В JDM совпадает с 0x540B; в USDM таблица 0x540B другая (224 = 8370), а здесь 7500 — менять вместе с 0x540B. Ab0VE ставит 205 (9146)","u":"","hi":false},{"a":3110,"f":"w","n":2,"x":"","g":"4. VTEC и ограничитель оборотов","t":"Ограничитель оборотов: начальный порог отсечки (в коде)","c":"✔","d":"операнд MOV 0x16A,#imm (0x0C23); стоково 244 = 7684 об/мин — совпадает с отсечкой H22A2 по мануалу (7700). Менять вместе с 0x540F. Ab0VE ставит 197 (9518)","u":"","hi":false},{"a":11940,"f":"raw","n":1,"x":"","g":"4. VTEC и ограничитель оборотов","t":"Ограничитель скорости: минимальные обороты","c":"✔","d":"LB A,#imm; CMPB A,0x179 (0x2EA3): пока RPM-байт ≤ этого значения, ограничитель скорости не срабатывает и его задержка сбрасывается. JDM — 200 ≈ 4500 об/мин; USDM — 255 (ограничитель выключен полностью: RPM-байт не бывает больше 255). Самый надёжный способ снять ограничитель — поставить 255","u":"rpmb","hi":false},{"a":11948,"f":"raw","n":1,"x":"VSS","g":"4. VTEC и ограничитель оборотов","t":"Ограничитель скорости, км/ч","c":"✔","d":"CMPB 0xDF,#imm (0x2EA9). Отсечка топлива, если скорость ≥ порога дольше 20 тиков (счётчик 0x1E3) при оборотах выше 0x2EA4; после снижения скорости отсечка держится ещё 2 тика (0x1E4). Работает только в вариантах конфигурации с битом 0x11F.0 = 1 (таблица 0x6CFF): в JDM включён, в USDM выключен. JDM — 180 км/ч, USDM и тюны — 255 (фактически выключен)","u":"kmh","hi":false},{"a":13770,"f":"raw","n":1,"x":"ECT","g":"4. VTEC и ограничитель оборотов","t":"VTEC: максимальное сырое значение ECT (чем больше — тем холоднее можно)","c":"✔","d":"LB A,#imm; CMPB A,0xD9 (0x35C9): VTEC разрешён при ECT ≤ этого значения. Стоково 0x44 = 68 ≈ 63 °C; 0xFF — проверка отключена (Ab0VE)","u":"ect","hi":false},{"a":20480,"f":"v0","n":44,"x":"","g":"3. Зажигание: коррекции","t":"Накопление в катушке: коэффициент по оборотам","c":"~","d":"0x2A7 × 0x2A8 → 0x2A9 (ограничено 0x0E…0xD0)","u":"","hi":false},{"a":20524,"f":"v0","n":26,"x":"VBAT","g":"3. Зажигание: коррекции","t":"Накопление в катушке: коэффициент по напряжению","c":"~","d":"0x2A8, вместе с 0x5000 даёт 0x2A9 — параметр начала зарядки катушки в формуле 0x46FB","u":"","hi":false},{"a":20550,"f":"v0","n":44,"x":"RPMb","g":"3. Зажигание: коррекции","t":"Компенсация задержки расчёта угла по оборотам","c":"~","d":"0x2B7 прибавляется к итоговому углу; растёт с оборотами (0 при ≤1000, 52 ед. ≈ 12° при ~8000 об/мин) — компенсирует время между расчётом и искрой","u":"deg","hi":false},{"a":20594,"f":"v0","n":12,"x":"ECT","g":"5. Пуск и прогрев (по ECT)","t":"Коэффициент по ECT → 0x2B1","c":"?","d":"","u":"","hi":false},{"a":20606,"f":"v2b","n":4,"x":"","g":"3. Зажигание: коррекции","t":"Таблица от 0x2B0 (2 точки)","c":"?","d":"","u":"","hi":false},{"a":20610,"f":"raw","n":4,"x":"","g":"3. Зажигание: коррекции","t":"Коррекция угла по ECT: две точки по MAP","c":"~","d":"x-точки (MAP) для интерполяции между значениями из 0x5086/0x5094 (или 0x50A2/0x50B0) → 0x2B2, прибавляется к углу","u":"","hi":false},{"a":20614,"f":"v0","n":14,"x":"ECT","g":"3. Зажигание: коррекции","t":"Коррекция угла по ECT: холодный мотор (ECT ≥ 0x28), при низкой нагрузке","c":"~","d":"значения по ECT → 0x278/0x279, интерполируются по MAP с точками 0x5082 → 0x2B2 (код 0x12B4, 0x23C7). Мануал: «угол корректируется по температуре ОЖ»","u":"","hi":false},{"a":20628,"f":"v0","n":14,"x":"ECT","g":"3. Зажигание: коррекции","t":"Коррекция угла по ECT: холодный мотор, при высокой нагрузке","c":"~","d":"значения по ECT → 0x278/0x279, интерполируются по MAP с точками 0x5082 → 0x2B2 (код 0x12B4, 0x23C7). Мануал: «угол корректируется по температуре ОЖ»","u":"","hi":true},{"a":20642,"f":"v0","n":14,"x":"ECT","g":"3. Зажигание: коррекции","t":"Коррекция угла по ECT: прогретый мотор (ECT /* Sensor scales (estimates): ECT/IAT thermistor curve from the service manual (beta model, R25 ≈ 2.04 kΩ, B ≈ 3546)
   with the ECU pull-up of 1.46 kΩ (measured: D13/D15 → +5 V, resistor network RM8);
   MAP/BARO byte from the manual's sensor line (0.55 V vacuum … 2.95 V atmosphere) and the code's (raw−24)·2 scaling. */
const ECT_NOTE = "термистор по графику мануала + подтяжка в ЭБУ 1.46 кОм (измерено: D13/D15 → +5 В, сборка RM8); точность определяется графиком мануала, ±2–3 °C";
function ectC(raw){ raw=Math.max(1,Math.min(254,raw)); const R=1.46*raw/(255-raw); return 1/(1/298.15+Math.log(R/2.04)/3546)-273.15; }
function ectRaw(c){ const R=2.04*Math.exp(3546*(1/(c+273.15)-1/298.15)); return Math.max(0,Math.min(255,Math.round(255*R/(R+1.46)))); }
function mapKpa(b){ const V=(b/2+24)*5/255; return (V-0.55)*101.3/2.4; }

function disp(t,raw){ const u=unitOf(t); return u ? dispNum(t,raw).toFixed(u.d) : ""+raw; }
function toRaw(t,val){ const u=unitOf(t); return u ? (u.inv ? u.inv(val) : Math.round(val/u.k)) : Math.round(val); }
function opDelta(t,val){ const u=unitOf(t); return u ? val/u.k : val; }
const G_CONST = "0. Константы";
CATALOG.forEach(t => { t.lg = (t.f==="w"||t.f==="raw") && t.n<=4 ? G_CONST : t.g; });
CATALOG.sort((x,y) => (x.lg===G_FEAT?0:1)-(y.lg===G_FEAT?0:1) || x.lg.localeCompare(y.lg, "ru", {numeric:true}) || x.a - y.a);
const COLLAPSE_KEY = "p13-editor-collapsed";
function loadCollapsed(){ try{ return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)||"[]")); }catch(e){ return new Set(); } }
function saveCollapsed(){ try{ localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...S.collapsed])); }catch(e){} }

const S = { units:true, orig:null, cur:null, ref:null, name:"", sel:null, undo:[], redo:[], fixCk:true, filters:new Set(), q:"", collapsed:loadCollapsed() };
const $ = s => document.querySelector(s);
const hex = (v,w=4) => v.toString(16).toUpperCase().padStart(w,"0");
function rpmB(b){ return Math.round(500 * 2 ** Math.floor(b/64) * (1 + (b%64)/64)); }
function rpmToB(rpm){ rpm=Math.max(500,Math.min(7999,rpm)); const o=Math.floor(Math.log2(rpm/500)); return Math.max(0,Math.min(255,Math.round(64*o+64*(rpm/(500*2**o)-1)))); }
const per2rpm = p => p ? Math.round(1875000/p) : 0;

function rd(buf,a,w){ return w===2 ? buf[a] | (buf[a+1]<<8) : buf[a]; }
function wr(buf,a,w,v){ if(w===2){ buf[a]=v&255; buf[a+1]=(v>>8)&255; } else buf[a]=v&255; }
function sum(buf){ let s=0; for(let i=0;i<buf.length;i++) s=(s+buf[i])&255; return s; }

/* ---------- table layouts: list of editable fields per table ---------- */
function layout(t){
  const n=t.n, a=t.a;
  const pts=(stride,xw,yw,count)=>{ const r=[]; for(let i=0;i<count;i++){ const o=a+i*stride; r.push({x:{a:o,w:xw}, y:{a:o+xw,w:yw}}); } return r; };
  switch(t.f){
    case "v0": return {kind:"pts", pts:pts(2,1,1,Math.floor(n/2))};
    case "v2": case "v2b": return {kind:"pts", pts:pts(2,1,1,2)};
    case "v1": return {kind:"pts", pts:pts(3,1,2,Math.floor(n/3))};
    case "v3": return {kind:"pts", pts:pts(3,1,2,2)};
    case "w16": return {kind:"pts", pts:pts(4,2,2,Math.floor(n/4))};
    case "grid": return {kind:"grid", rows:20, cols:10};
    case "grid11": return {kind:"grid", rows:11, cols:10, rowOff:4};
    case "wrpm": return {kind:"words", count:n/2, rpm:true};
    case "w": return {kind:"words", count:Math.floor(n/2), rpm:/Ограничитель/.test(t.t)};
    case "row": return {kind:"row", count:n};
    default: return t.u ? {kind:"row", count:t.n, noAxis:true} : {kind:"raw"};
  }
}
function tableBytes(t){ return [t.a, t.a + t.n]; }
function diffCount(a,b,t){ if(!a||!b) return 0; if(t.bytes) return t.bytes.filter(i=>a[i]!==b[i]).length; let c=0; for(let i=t.a;i<t.a+t.n && i<ROMSIZE;i++) if(a[i]!==b[i]) c++; return c; }
function rpmAxis(buf,hi){ const base=hi?0x6028:0x6000; const r=[]; for(let i=0;i<20;i++) r.push(per2rpm(rd(buf,base+2*i,2))); return r; }

/* ---------- edits with undo ---------- */
function applyEdits(list,label){
  // list: [{a,w,v}] ; records byte-level old/new
  const rec=[];
  for(const e of list){
    const max = e.w===2 ? 0xFFFF : 0xFF;
    const v = Math.max(0, Math.min(max, Math.round(e.v)));
    for(let k=0;k<e.w;k++){
      const ad=e.a+k, nv = e.w===2 ? (k? (v>>8)&255 : v&255) : v;
      if(S.cur[ad]!==nv){ rec.push([ad,S.cur[ad],nv]); S.cur[ad]=nv; }
    }
  }
  if(!rec.length) return false;
  S.undo.push({label,rec}); S.redo.length=0; refresh(); return true;
}
function undo(){ const u=S.undo.pop(); if(!u) return; for(let i=u.rec.length-1;i>=0;i--){ const [a,o]=u.rec[i]; S.cur[a]=o; } S.redo.push(u); toast("Отменено: "+u.label); refresh(); }
function redo(){ const u=S.redo.pop(); if(!u) return; for(const [a,,n] of u.rec) S.cur[a]=n; S.undo.push(u); toast("Повторено: "+u.label); refresh(); }

/* ---------- file loading ---------- */
function readFile(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(new Uint8Array(r.result)); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(file); }); }
function checkRom(buf){
  if(buf.length!==ROMSIZE) return `Размер файла ${buf.length} байт, а прошивка P13 — ровно 32768 байт (32 КБ).`;
  for(const [a,b] of SIG) for(let i=0;i<b.length;i++) if(buf[a+i]!==b[i])
    return `По адресу 0x${hex(a+i)} ожидался байт ${hex(b[i],2)}, а в файле ${hex(buf[a+i],2)}. Это не прошивка P13 этой версии кода — адреса карт к ней не подходят.`;
  return null;
}
async function loadMain(file){
  let buf; try{ buf=await readFile(file); }catch(e){ return showError("Не удалось прочитать файл: "+e.message); }
  const err=checkRom(buf);
  if(err) return showError(err);
  S.orig=buf; S.cur=new Uint8Array(buf); S.name=file.name; S.undo=[]; S.redo=[];
  if(!S.sel) S.sel="63F8";
  refresh(); toast(`Загружено: ${file.name}`);
}
async function loadRef(file){
  let buf; try{ buf=await readFile(file); }catch(e){ return toast("Не удалось прочитать эталон"); }
  const err=checkRom(buf);
  if(err) return toast("Эталон не подходит: "+err);
  S.ref=buf; S.refName=file.name; refresh(); toast(`Эталон: ${file.name}`);
}
function showError(m){ const p=$("#pane"); p.innerHTML=""; p.append(emptyState()); const d=document.createElement("div"); d.className="msg err"; d.textContent=m; p.prepend(d); }

/* ---------- header / status ---------- */
function renderHeader(){
  $("#fname").textContent = S.cur ? S.name : "Файл не загружен";
  const P=$("#pills"); P.innerHTML="";
  const pill=(txt,cls,title)=>{ const s=document.createElement("span"); s.className="pill "+(cls||""); s.textContent=txt; if(title) s.title=title; P.append(s); };
  if(S.cur){
    const ck=sum(S.cur), flag=S.cur[CKSUM_FLAG];
    if(ck===0) pill("сумма OK","ok","Сумма всех байт по модулю 256 равна 0");
    else pill(`сумма ${hex(ck,2)}`, S.fixCk?"chg":"bad", S.fixCk?"Будет исправлена при скачивании через байт 0x3A":"ECU с включённой проверкой не запустится (код 4B)");
    const cs=crcState(S.cur); pill(cs.allOff?"проверка суммы ECU выкл.":cs.anyOff?"проверка суммы ECU: частично":"проверка суммы ECU вкл.", cs.anyOff&&!cs.allOff?"bad":"", cs.flagOff?"Байт 0x7FF1 = 00 — ECU не проверяет контрольную сумму":"Проверки суммы в коде: при старте 0x09DB и во время работы 0x0D22 (см. «Быстрые настройки»)");
    let changed=0; for(let i=0;i<ROMSIZE;i++) if(S.cur[i]!==S.orig[i]) changed++;
    if(changed) pill(`изменено байт: ${changed}`,"chg");
    if(S.ref) pill(`эталон: ${S.refName}`,"","Отличия от эталона отмечены фиолетовым");
  }
  $("#saveBtn").disabled=!S.cur; $("#undoBtn").disabled=!S.undo.length; $("#redoBtn").disabled=!S.redo.length;
  $("#refLbl").style.opacity = S.cur ? "" : ".5";
}

/* ---------- index ---------- */
function renderList(){
  const L=$("#list"); L.innerHTML="";
  const q=S.q.trim().toLowerCase().replace(/^0x/,"");
  const groups=new Map();
  for(const t of CATALOG){
    if(S.filters.has("main") && !t.g.startsWith("1.") && t.lg!==G_CONST && t.lg!==G_FEAT) continue;
    const chg = S.cur ? diffCount(S.cur,S.orig,t) : 0;
    const rdf = S.cur && S.ref ? diffCount(S.cur,S.ref,t) : 0;
    if(S.filters.has("chg") && !chg) continue;
    if(S.filters.has("ref") && !rdf) continue;
    if(q && !(t.id.toLowerCase().includes(q) || t.t.toLowerCase().includes(q) || (t.d||"").toLowerCase().includes(q))) continue;
    if(!groups.has(t.lg)) groups.set(t.lg,[]);
    groups.get(t.lg).push({t,chg,rdf});
  }
  for(const [g,items] of groups){
    // while searching, show matches even inside collapsed groups
    const open = q ? true : !S.collapsed.has(g);
    const h=document.createElement("button"); h.className="grp"+(g===G_CONST||g===G_FEAT?" const":""); h.setAttribute("aria-expanded",open);
    const nChg=items.filter(x=>x.chg).length, nRef=items.filter(x=>x.rdf).length;
    h.innerHTML=`<span class="chev" aria-hidden="true">▾</span><span class="gt"></span><span class="cnt"></span>`;
    h.querySelector(".gt").textContent=g.replace(/^\d+\.\s*/,"");
    const cnt=h.querySelector(".cnt");
    if(nChg){ const d=document.createElement("span"); d.className="dot chg"; d.title=`изменено таблиц: ${nChg}`; cnt.append(d); }
    if(nRef){ const d=document.createElement("span"); d.className="dot ref"; d.title=`отличаются от эталона: ${nRef}`; cnt.append(d); }
    cnt.append(document.createTextNode(items.length));
    h.onclick=()=>{ if(S.collapsed.has(g)) S.collapsed.delete(g); else S.collapsed.add(g); saveCollapsed(); renderList(); };
    L.append(h);
    if(!open) continue;
    for(const {t,chg,rdf} of items){
      const it=document.createElement("div"); it.className="item"; it.tabIndex=0; it.setAttribute("role","button");
      if(S.sel===t.id) it.setAttribute("aria-current","true");
      it.innerHTML=`<span class="ad"></span><span class="nm"></span><span class="mk"></span>`;
      it.children[0].textContent=t.id; it.children[1].textContent=t.t; it.title=t.t;
      const mk=it.children[2];
      if(chg){ const d=document.createElement("span"); d.className="dot chg"; d.title=`изменено байт: ${chg}`; mk.append(d); }
      if(rdf){ const d=document.createElement("span"); d.className="dot ref"; d.title=`отличий от эталона: ${rdf}`; mk.append(d); }
      const c=document.createElement("span"); c.className="conf"; c.textContent=t.c; c.title=CONF[t.c]; mk.append(c);
      const go=()=>{ S.sel=t.id; S.cell=null; refresh(); if(matchMedia("(max-width:820px)").matches) $("#pane").scrollIntoView({block:"start"}); };
      it.onclick=go; it.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
      L.append(it);
    }
  }
  if(!L.children.length){ const d=document.createElement("div"); d.className="grp"; d.textContent="Ничего не найдено"; L.append(d); }
}

/* ---------- heat color ---------- */
function heat(v,lo,hi){
  const f = hi>lo ? (v-lo)/(hi-lo) : .5;
  const h = 225 - 225*f; // blue → red
  const cs=getComputedStyle(document.documentElement);
  return `hsl(${h.toFixed(0)} ${cs.getPropertyValue("--heat-s").trim()} ${cs.getPropertyValue("--heat-l").trim()})`;
}

/* ---------- speed limiter quick setting ---------- */
// code 0x2E9A–0x2EC1: fuel cut when VSS ≥ [0x2EAC] for 20 ticks while RPM-byte > [0x2EA4], only if config bit 0x11F.0 = 1
function spdCfg(buf){
  const vs=new Set(); for(let i=0;i<SPD.idxN;i++){ const x=buf[SPD.idx+i]; if(x!==0xFF) vs.add(x); }
  let on=0, off=0; for(const x of vs){ if(buf[SPD.cfg+4*x+1]&1) on++; else off++; }
  return {on, off};
}
function spdState(buf){ const r=buf[SPD.rpm], l=buf[SPD.lim], c=spdCfg(buf); return {r, l, c, active: c.on>0 && r<255 && l<255}; }
function speedPane(preview){
  const wrap=document.createElement("div"); wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="14px";
  const d=document.createElement("div"); d.className="titlebar";
  d.innerHTML=`<h1>Ограничитель скорости</h1><div class="meta mono"><span>лимит 0x2EAC</span><span>порог оборотов 0x2EA4</span><span>код 0x2E9A–0x2EC1</span><span>✔ подтверждено кодом</span></div>
  <div class="note">При скорости не ниже лимита дольше 20 тиков счётчика (защита от выбросов датчика) и оборотах выше порога 0x2EA4 ЭБУ отсекает топливо — тем же выходом, что и ограничитель оборотов. После снижения скорости отсечка держится ещё 2 тика. Ограничитель работает только в тех вариантах конфигурации платы, где установлен бит 0x11F.0 (таблица 0x6CFF): в JDM — да, в USDM — нет.</div>`;
  wrap.append(d);
  if(preview){ const n=document.createElement("div"); n.className="note"; n.textContent="Загрузите прошивку, чтобы включить, выключить или изменить лимит."; d.append(n); return wrap; }
  const st=spdState(S.cur), o=spdState(S.orig);
  const pn=document.createElement("div"); pn.className="panel"; pn.style.maxWidth="640px"; pn.innerHTML="<h2>Настройка</h2>";
  const status=document.createElement("p"); status.style.margin="0 0 10px";
  const why=[];
  if(st.c.on===0) why.push("отключён в таблице конфигурации платы (бит 0x11F.0)");
  if(st.r===255) why.push("порог оборотов 0x2EA4 = 255");
  if(st.l===255) why.push("лимит 0x2EAC = 255 км/ч");
  status.innerHTML = st.active
    ? `<b style="color:var(--good)">Включён:</b> отсечка топлива при скорости ≥ <b class="mono">${st.l} км/ч</b> и оборотах выше <span class="mono">${rpmB(st.r)} об/мин</span> (0x2EA4 = ${st.r}).`
    : `<b style="color:var(--muted)">Выключен:</b> ${why.join("; ")}.`;
  if(o.active!==st.active || o.l!==st.l || o.r!==st.r){ const s=document.createElement("span"); s.className="axisnote"; s.textContent=` В исходном файле: ${o.active?`включён, ${o.l} км/ч`:"выключен"}.`; status.append(s); }
  pn.append(status);
  const cfgOff = st.c.on===0;
  const lab=document.createElement("label"); lab.className="toggle";
  lab.innerHTML=`<input type="checkbox" ${st.active?"checked":""} ${cfgOff?"disabled":""}> Ограничитель включён`;
  pn.append(lab);
  const row=document.createElement("div"); row.style.cssText="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px";
  row.innerHTML=`<label for="spdLim">Лимит, км/ч</label><input id="spdLim" type="number" min="1" max="254" step="1" class="mono" style="width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)" ${cfgOff?"disabled":""}><button class="btn small" ${cfgOff?"disabled":""}>Задать</button>`;
  const inp=row.querySelector("input"); inp.value = st.l<255 ? st.l : (o.l<255 ? o.l : SPD.limDef);
  pn.append(row);
  const limVal=()=>{ const v=Math.round(Number(inp.value)); return v>=1 && v<=254 ? v : null; };
  lab.querySelector("input").onchange=e=>{
    if(e.target.checked){
      const ed=[], v=limVal()??SPD.limDef;
      if(S.cur[SPD.rpm]===255) ed.push({a:SPD.rpm, w:1, v: S.orig[SPD.rpm]<255 ? S.orig[SPD.rpm] : SPD.rpmOn});
      if(S.cur[SPD.lim]===255) ed.push({a:SPD.lim, w:1, v});
      if(applyEdits(ed,"ограничитель скорости: включён")) toast(`Ограничитель скорости включён: ${S.cur[SPD.lim]} км/ч`);
    } else if(applyEdits([{a:SPD.rpm, w:1, v:255}],"ограничитель скорости: выключен")) toast("Ограничитель скорости выключен (0x2EA4 = 255)");
  };
  const setLim=()=>{ const v=limVal(); if(v===null) return toast("Лимит — целое число от 1 до 254 км/ч");
    if(applyEdits([{a:SPD.lim, w:1, v}],`ограничитель скорости: ${v} км/ч`)) toast(`Лимит: ${v} км/ч${spdState(S.cur).active?"":" — ограничитель выключен, включите переключателем"}`); else toast(`Лимит уже ${v} км/ч`); };
  row.querySelector("button").onclick=setLim;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); setLim(); } };
  const hint=document.createElement("p"); hint.className="axisnote"; hint.style.margin="10px 0 0";
  hint.textContent="Выключение записывает 255 в порог оборотов 0x2EA4: RPM-байт не бывает больше 255, поэтому проверка скорости не выполняется никогда (так сделано в стоковой USDM). Включение возвращает исходный порог (в JDM 200 ≈ 4500 об/мин). Показания скорости — байт датчика VSS 0xDF, км/ч.";
  pn.append(hint);
  if(cfgOff){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="В этой прошивке ограничитель отключён таблицей конфигурации (бит 0x11F.0 = 0 во всех вариантах платы, как в USDM), поэтому байты 0x2EA4/0x2EAC на работу не влияют. Тот же бит управляет и другой функцией (код 0x3061), поэтому редактор его не меняет."; pn.append(w); }
  else if(st.c.off>0){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="В части вариантов конфигурации платы ограничитель отключён (бит 0x11F.0 = 0): работает он или нет, зависит от перемычек на конкретной плате."; pn.append(w); }
  wrap.append(pn);
  return wrap;
}

/* ---------- checksum check quick setting ---------- */
function crcPane(preview){
  const wrap=document.createElement("div"); wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="14px";
  const d=document.createElement("div"); d.className="titlebar";
  d.innerHTML=`<h1>Проверка контрольной суммы (CRC)</h1><div class="meta mono"><span>патч кода 0x09DB, 0x0D22</span><span>флаг 0x7FF1</span><span>✔ подтверждено кодом</span></div>
  <div class="note">ЭБУ требует, чтобы сумма всех байт ROM была равна 0, и проверяет это в двух местах: при старте после потери питания (0x09DB — отключали АКБ, разъём, меняли чип) и периодически во время работы (0x0D22). При ошибке он перезапускается с кодом 4B. Распространённый патч 03 36 0D 00 в 0x0D22 убирает только вторую проверку — после отключения АКБ такая прошивка с неверной суммой не запустится.</div>`;
  wrap.append(d);
  if(preview){ const n=document.createElement("div"); n.className="note"; n.textContent="Загрузите прошивку, чтобы включить или отключить проверку."; d.append(n); return wrap; }
  const c=crcState(S.cur), o=crcState(S.orig), s=sum(S.cur);
  const desc=x=> x.flagOff ? "выключена флагом 0x7FF1 = 0" : x.unknown ? "код изменён иначе" : x.allOff ? "отключена патчем (обе проверки)" : x.anyOff ? "отключена только "+CRC.sites.filter((_,i)=>x.st[i]==="off").map(z=>z.name).join(", ") : "включена (сток)";
  const pn=document.createElement("div"); pn.className="panel"; pn.style.maxWidth="640px"; pn.innerHTML="<h2>Настройка</h2>";
  const status=document.createElement("p"); status.style.margin="0 0 10px";
  status.innerHTML = `<b style="color:${c.allOff?"var(--changed)":c.anyOff||c.unknown?"var(--bad)":"var(--good)"}">Проверка ${desc(c)}.</b> Сумма сейчас: <span class="mono">${hex(s,2)}</span>${s===0?" (OK)":S.fixCk?" — будет исправлена при скачивании (байт 0x3A)":" — неверная"}.`;
  if(desc(o)!==desc(c)){ const z=document.createElement("span"); z.className="axisnote"; z.textContent=` В исходном файле: ${desc(o)}.`; status.append(z); }
  pn.append(status);
  const kv=document.createElement("dl"); kv.className="kv mono"; kv.style.marginBottom="10px";
  kv.innerHTML=CRC.sites.map((z,i)=>`<dt>0x${hex(z.a)} ${z.name}</dt><dd>${z.on.map((_,k)=>hex(S.cur[z.a+k],2)).join(" ")} — ${c.st[i]==="on"?"проверка ("+z.on_s+")":c.st[i]==="off"?"обход ("+z.off_s+")":"неизвестный код"}</dd>`).join("");
  pn.append(kv);
  const lab=document.createElement("label"); lab.className="toggle";
  const dis = c.unknown || c.flagOff;
  lab.innerHTML=`<input type="checkbox" ${c.allOff?"":"checked"} ${dis?"disabled":""}> Проверка контрольной суммы включена`;
  lab.querySelector("input").onchange=e=>{
    const k=e.target.checked?"on":"off", ed=[];
    for(const z of CRC.sites) z[k].forEach((v,i)=>ed.push({a:z.a+i, w:1, v}));
    if(applyEdits(ed, k==="on"?"CRC: проверка включена":"CRC: проверка отключена")) toast(k==="on"?"Проверка контрольной суммы включена (стоковый код)":"Проверка контрольной суммы отключена (патч 0x09DB, 0x0D22)");
  };
  pn.append(lab);
  const hint=document.createElement("p"); hint.className="axisnote"; hint.style.margin="10px 0 0";
  hint.textContent = CRC.sites.map(z=>`0x${hex(z.a)}: ${z.on.map(v=>hex(v,2)).join(" ")} (${z.on_s}) → ${z.off.map(v=>hex(v,2)).join(" ")} (${z.off_s})`).join("; ")
    + ". Флаг 0x7FF1 = 0 тоже выключает проверку, но одновременно заставляет ЭБУ брать вариант конфигурации из 0x7FF2 вместо кодирующих входов, поэтому редактор использует патч кода. Исправление суммы при скачивании от этой настройки не зависит.";
  pn.append(hint);
  if(c.anyOff && !c.allOff){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="Отключена только одна проверка. Если сумма неверна, ЭБУ остановится с кодом 4B на оставшейся. Снимите галочку, чтобы отключить обе, или скачайте файл с исправленной суммой."; pn.append(w); }
  if(c.flagOff){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="0x7FF1 = 0: проверка уже выключена флагом, и вариант конфигурации берётся из 0x7FF2. Переключатель недоступен — меняйте байт 0x7FF1 в таблице 0x7FF0, если нужно."; pn.append(w); }
  if(c.unknown){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="Байты в одном из мест не совпадают ни со стоком, ни с патчем — переключатель недоступен, чтобы не испортить чужой патч."; pn.append(w); }
  wrap.append(pn);
  return wrap;
}

/* ---------- EGR quick setting ---------- */
function egrState(buf){ const m=k=>EGR.patches.every(p=>p[k].every((v,i)=>buf[p.a+i]===v)); return m("on")?"on":m("off")?"off":"unknown"; }
function egrPane(preview){
  const wrap=document.createElement("div"); wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="14px";
  const d=document.createElement("div"); d.className="titlebar";
  d.innerHTML=`<h1>EGR: отключение</h1><div class="meta mono"><span>патч кода 0x34A1, 0x3A76</span><span>карты цели 0x6740–0x688A</span><span>датчик подъёма — АЦП-канал 7</span><span>~ по разбору кода</span></div>
  <div class="note">ЭБУ считает целевой подъём клапана EGR по картам 0x6740/0x67AE (низкие кулачки; на высоких в стоке нули), открывает клапан соленоидом со скважностью (таймер TMR3) и сверяет фактический подъём по датчику. Если датчик показывает слишком высокий сигнал или подъём заметно расходится с целью, выставляется неисправность EGR (по логике — код 12). Отключение нужно, если клапан снят или заглушён.</div>`;
  wrap.append(d);
  if(preview){ const n=document.createElement("div"); n.className="note"; n.textContent="Загрузите прошивку, чтобы отключить или вернуть EGR."; d.append(n); return wrap; }
  const st=egrState(S.cur), o=egrState(S.orig);
  const NAME={on:"EGR работает (стоковый код)", off:"EGR отключён", unknown:"код изменён иначе"};
  const pn=document.createElement("div"); pn.className="panel"; pn.style.maxWidth="640px"; pn.innerHTML="<h2>Настройка</h2>";
  const status=document.createElement("p"); status.style.margin="0 0 10px";
  status.innerHTML = st==="on" ? `<b style="color:var(--good)">Включён:</b> EGR работает как в стоке.`
    : st==="off" ? `<b style="color:var(--changed)">Отключён:</b> цель подъёма всегда 0 — клапан закрыт, соленоид выключен, флаг «EGR работает» (0x11B.4) снят; проверка датчика подъёма пропущена.`
    : `<b style="color:var(--bad)">Неизвестное состояние:</b> байты в 0x34A1/0x3A76 не совпадают ни со стоком, ни с патчем.`;
  if(o!==st){ const s=document.createElement("span"); s.className="axisnote"; s.textContent=` В исходном файле: ${NAME[o]}.`; status.append(s); }
  pn.append(status);
  const lab=document.createElement("label"); lab.className="toggle";
  lab.innerHTML=`<input type="checkbox" ${st==="on"?"checked":""} ${st==="unknown"?"disabled":""}> EGR включён`;
  lab.querySelector("input").onchange=e=>{
    const k=e.target.checked?"on":"off", ed=[];
    for(const p of EGR.patches) p[k].forEach((v,i)=>ed.push({a:p.a+i, w:1, v}));
    if(applyEdits(ed, k==="on"?"EGR: включён":"EGR: отключён")) toast(k==="on"?"EGR включён (стоковый код)":"EGR отключён (патч 0x34A1, 0x3A76)");
  };
  pn.append(lab);
  const go=document.createElement("div"); go.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px";
  go.innerHTML=`<span class="axisnote">Карты цели:</span>`;
  for(const [id,txt] of [["67AE","0x67AE МКПП"],["6740","0x6740 АКПП"]]){ const b=document.createElement("button"); b.className="btn small"; b.textContent=txt; b.onclick=()=>{ S.sel=id; S.cell=null; refresh(); }; go.append(b); }
  pn.append(go);
  const hint=document.createElement("p"); hint.className="axisnote"; hint.style.margin="10px 0 0";
  hint.textContent = EGR.patches.map(p=>`0x${hex(p.a)}: ${p.on.map(v=>hex(v,2)).join(" ")} (${p.on_s}) → ${p.off.map(v=>hex(v,2)).join(" ")} (${p.off_s})`).join("; ")
    + ". Первый патч пропускает расчёт цели, второй — проверку «сигнал датчика подъёма слишком высокий»; проверка расхождения подъёма с целью при нулевой цели не выполняется сама. Эти байты одинаковы во всех изученных прошивках P13.";
  pn.append(hint);
  if(st==="unknown"){ const w=document.createElement("div"); w.className="msg warn"; w.style.marginTop="10px";
    w.textContent="Сейчас: "+EGR.patches.map(p=>`0x${hex(p.a)} = ${[0,1,2].map(i=>hex(S.cur[p.a+i],2)).join(" ")}`).join(", ")+". Переключатель недоступен, чтобы не испортить чужой патч; посмотрите эти адреса через «Произвольный адрес»."; pn.append(w); }
  const w2=document.createElement("div"); w2.className="msg warn"; w2.style.marginTop="10px";
  w2.textContent="Без EGR на частичных нагрузках растут температура сгорания и NOx, а с ними склонность к детонации — проверьте углы зажигания. Там, где выхлоп проверяют, отключение EGR может быть незаконным. В машине патч не проверялся.";
  pn.append(w2);
  wrap.append(pn);
  return wrap;
}

/* ---------- pane ---------- */
function renderPane(){
  const p=$("#pane"); p.innerHTML="";
  const t=CATALOG.find(x=>x.id===S.sel);
  if(!S.cur){
    p.append(emptyState());
    if(t) p.append(t.feat ? t.pane(true) : infoBlock(t,true));
    return;
  }
  if(!t) return;
  if(t.feat){ p.append(t.pane(false)); p.append(sidePanels(t)); return; }
  p.append(infoBlock(t,false));
  const L=layout(t);
  if(L.kind==="grid") p.append(gridEditor(t,L));
  else if(L.kind==="pts") p.append(ptsEditor(t,L));
  else if(L.kind==="words") p.append(wordsEditor(t,L));
  else if(L.kind==="row") p.append(rowEditor(t,L));
  else p.append(hexEditor(t.a, Math.max(t.n,16), t));
  p.append(sidePanels(t));
}
function infoBlock(t,preview){
  const d=document.createElement("div"); d.className="titlebar";
  const h=document.createElement("h1"); h.textContent=t.t; d.append(h);
  const m=document.createElement("div"); m.className="meta mono";
  const add=s=>{ const e=document.createElement("span"); e.textContent=s; m.append(e); };
  add("0x"+t.id+"–0x"+hex(t.a+t.n-1)); add(FMT[t.f]||t.f); add(t.n+" байт"); if(t.x) add("вход: "+(XIN[t.x]||t.x)); add(t.c+" "+CONF[t.c]);
  d.append(m);
  if(t.d){ const n=document.createElement("div"); n.className="note"; n.textContent=t.d; d.append(n); }
  if(preview){ const n=document.createElement("div"); n.className="note"; n.textContent="Загрузите прошивку, чтобы увидеть и изменить значения."; d.append(n); }
  return d;
}

/* toolbar shared by grid / row / pts */
function toolbar(onOp, extra, t){
  const d=document.createElement("div"); d.className="tools";
  d.innerHTML=`<input type="number" id="opVal" value="1" step="any" aria-label="Значение">
  <button class="btn small" data-op="set">= Задать</button><button class="btn small" data-op="add">+ Прибавить</button><button class="btn small" data-op="sub">− Вычесть</button><button class="btn small" data-op="pct">× %</button>
  <span class="sep"></span><button class="btn small" data-op="smooth">Сгладить</button><button class="btn small" data-op="interp">Интерполировать</button>
  <span class="sep"></span><button class="btn small" data-op="orig">Вернуть исходное</button><button class="btn small" data-op="ref" ${S.ref?"":"disabled"}>Взять из эталона</button>`;
  d.querySelectorAll("[data-op]").forEach(b=>b.onclick=()=>onOp(b.dataset.op, parseFloat(d.querySelector("#opVal").value)));
  if(t && t.u){ const sep=document.createElement("span"); sep.className="sep"; const b=document.createElement("button"); b.className="btn small"; b.id="unitBtn";
    b.textContent = S.units ? `Показано: ${UNITS[t.u].name} · переключить на сырые` : `Показано: сырые · переключить на ${UNITS[t.u].name}`;
    b.title=UNITS[t.u].note; b.onclick=()=>{ S.units=!S.units; refresh(); }; d.append(sep,b); }
  if(extra){ const s=document.createElement("span"); s.className="hint"; s.textContent=extra + (unitOf(t)?` Значения и ввод — в единицах «${unitOf(t).name}»: ${unitOf(t).note}.`:""); d.append(s); }
  return d;
}
function opValue(op,old,val,origv,refv,t){
  switch(op){
    case "set": return t?toRaw(t,val):val;
    case "add": return t&&unitOf(t) ? toRaw(t,dispNum(t,old)+val) : old+val;
    case "sub": return t&&unitOf(t) ? toRaw(t,dispNum(t,old)-val) : old-val;
    case "pct": return old*(1+val/100); case "orig": return origv; case "ref": return refv;
  }
  return old;
}

/* ---------- 2D map ---------- */
function gridEditor(t,L){
  const wrap=document.createElement("div"); wrap.style.display="flex"; wrap.style.flexDirection="column"; wrap.style.gap="10px";
  const R=L.rows, C=L.cols, off=L.rowOff||0;
  const axis=rpmAxis(S.cur,t.hi).slice(off,off+R);
  const loadAx=[...S.cur.slice(0x6050,0x605A)];
  const at=(r,c)=>t.a+r*C+c;
  if(!S.cell || S.cell.t!==t.id) S.cell={t:t.id,r:0,c:0,r2:0,c2:0};
  const sel=()=>{ const s=S.cell; return [Math.min(s.r,s.r2),Math.max(s.r,s.r2),Math.min(s.c,s.c2),Math.max(s.c,s.c2)]; };
  const cellsSel=()=>{ const [r0,r1,c0,c1]=sel(); const a=[]; for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) a.push([r,c]); return a; };
  const doOp=(op,val)=>{
    const list=[];
    if(op==="smooth"){
      for(const [r,c] of cellsSel()){ let s=0,n=0; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const rr=r+dr,cc=c+dc; if(rr>=0&&rr<R&&cc>=0&&cc<C){ s+=S.cur[at(rr,cc)]*(dr||dc?1:4); n+=dr||dc?1:4; } } list.push({a:at(r,c),w:1,v:s/n}); }
    } else if(op==="interp"){
      const [r0,r1,c0,c1]=sel();
      for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
        const fr=r1>r0?(r-r0)/(r1-r0):0, fc=c1>c0?(c-c0)/(c1-c0):0;
        const q=(rr,cc)=>S.cur[at(rr,cc)];
        const v = r1>r0 && c1>c0 ? (q(r0,c0)*(1-fr)*(1-fc)+q(r0,c1)*(1-fr)*fc+q(r1,c0)*fr*(1-fc)+q(r1,c1)*fr*fc)
                : r1>r0 ? q(r0,c)*(1-fr)+q(r1,c)*fr : q(r,c0)*(1-fc)+q(r,c1)*fc;
        list.push({a:at(r,c),w:1,v});
      }
    } else for(const [r,c] of cellsSel()){ const a=at(r,c); list.push({a,w:1,v:opValue(op,S.cur[a],val,S.orig[a],S.ref?S.ref[a]:S.cur[a],t)}); }
    applyEdits(list, `${t.id}: ${op}`);
  };
  wrap.append(toolbar(doOp,"Выделение: клик, Shift+клик или протяжка. Ввод числа — сразу в ячейку, Enter — записать. +/− меняют на 1 сырую единицу, Ctrl+C / Ctrl+V — копирование в Excel и обратно.",t));
  let vals=[]; for(let r=0;r<R;r++) for(let c=0;c<C;c++) vals.push(S.cur[at(r,c)]);
  const lo=Math.min(...vals), hi=Math.max(...vals);
  const sc=document.createElement("div"); sc.className="scroll";
  const tb=document.createElement("table"); tb.className="grid"; tb.tabIndex=0; tb.id="gridTable";
  let h=`<thead><tr><th>об/мин \\ нагрузка</th>${loadAx.map(v=>`<th title="0x6050: сырое ${v}">${Math.round(v*100/255)}%</th>`).join("")}</tr></thead><tbody>`;
  const [r0,r1,c0,c1]=sel();
  for(let r=0;r<R;r++){
    h+=`<tr><th>${axis[r]??""}</th>`;
    for(let c=0;c<C;c++){
      const a=at(r,c), v=S.cur[a];
      const cls=[]; if(v!==S.orig[a]) cls.push("chg"); if(S.ref && v!==S.ref[a]) cls.push("rdf");
      if(r>=r0&&r<=r1&&c>=c0&&c<=c1) cls.push("sel"); if(r===S.cell.r2&&c===S.cell.c2) cls.push("cur");
      const tip=`0x${hex(a)} · сырое ${v} · было ${disp(t,S.orig[a])}`+(S.ref?` · эталон ${disp(t,S.ref[a])}`:"");
      h+=`<td class="${cls.join(" ")}" data-r="${r}" data-c="${c}" style="background:${heat(v,lo,hi)}" title="${tip}">${disp(t,v)}</td>`;
    }
    h+="</tr>";
  }
  tb.innerHTML=h+"</tbody>";
  let drag=false;
  tb.addEventListener("mousedown",e=>{ const td=e.target.closest("td"); if(!td||td.querySelector("input")) return; const r=+td.dataset.r,c=+td.dataset.c;
    if(e.shiftKey){ S.cell.r2=r; S.cell.c2=c; } else S.cell={t:t.id,r,c,r2:r,c2:c}; drag=true; markSel(tb,sel()); tb.focus(); e.preventDefault(); });
  tb.addEventListener("mouseover",e=>{ if(!drag) return; const td=e.target.closest("td"); if(!td) return; S.cell.r2=+td.dataset.r; S.cell.c2=+td.dataset.c; markSel(tb,sel()); });
  window.addEventListener("mouseup",()=>{ drag=false; },{once:true});
  tb.addEventListener("dblclick",e=>{ const td=e.target.closest("td"); if(td) startEdit(td,disp(t,S.cur[at(+td.dataset.r,+td.dataset.c)])); });
  const startEdit=(td,init)=>{
    const r=+td.dataset.r,c=+td.dataset.c, a=at(r,c);
    const inp=document.createElement("input"); inp.type="text"; inp.inputMode="numeric"; inp.value=init; inp.setAttribute("aria-label","Значение ячейки");
    td.textContent=""; td.append(inp); inp.focus(); inp.select();
    let done=false;
    const commit=(ok,move)=>{ if(done) return; done=true; const v=parseFloat(inp.value.replace(",","."));
      if(ok && !isNaN(v)) applyEdits([{a,w:1,v:toRaw(t,v)}], `${t.id}: ячейка`);
      if(move){ S.cell={t:t.id,r:Math.min(R-1,r+move),c,r2:Math.min(R-1,r+move),c2:c}; }
      refresh(); requestAnimationFrame(()=>{ const g=$("#gridTable"); if(g) g.focus(); }); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(true,1);} else if(e.key==="Escape"){ e.preventDefault(); commit(false);} else if(e.key==="Tab"){ e.preventDefault(); commit(true,0);} e.stopPropagation(); };
    inp.onblur=()=>commit(true);
  };
  tb.addEventListener("keydown",e=>{
    const s=S.cell; const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if(mv){ e.preventDefault(); const nr=Math.max(0,Math.min(R-1,s.r2+mv[0])), nc=Math.max(0,Math.min(C-1,s.c2+mv[1]));
      if(e.shiftKey){ s.r2=nr; s.c2=nc; } else S.cell={t:t.id,r:nr,c:nc,r2:nr,c2:nc}; markSel(tb,sel()); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="c"){ e.preventDefault(); const [a0,a1,b0,b1]=sel(); const rows=[]; for(let r=a0;r<=a1;r++){ const row=[]; for(let c=b0;c<=b1;c++) row.push(disp(t,S.cur[at(r,c)])); rows.push(row.join("\t")); }
      const txt=rows.join("\n"); if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("Скопировано в буфер обмена"),()=>toast("Браузер не дал доступ к буферу обмена")); return; }
    if(e.key==="+"||e.key==="="){ e.preventDefault(); doOp("add", e.shiftKey&&e.key==="="?1:1); return; }
    if(e.key==="-"||e.key==="_"){ e.preventDefault(); doOp("sub",1); return; }
    if(e.key==="Enter"||e.key==="F2"){ e.preventDefault(); const td=tb.querySelector(`td[data-r="${s.r2}"][data-c="${s.c2}"]`); if(td) startEdit(td,disp(t,S.cur[at(s.r2,s.c2)])); return; }
    if(/^[0-9.,]$/.test(e.key) && !e.ctrlKey && !e.metaKey){ e.preventDefault(); const td=tb.querySelector(`td[data-r="${s.r2}"][data-c="${s.c2}"]`); if(td) startEdit(td,e.key); return; }
  });
  tb.addEventListener("paste",e=>{
    const txt=(e.clipboardData||window.clipboardData).getData("text"); if(!txt) return; e.preventDefault();
    const rows=txt.trim().split(/\r?\n/).map(l=>l.split(/[\t; ]+/).map(x=>parseFloat(x.replace(",","."))));
    const [a0,,b0]=sel(); const list=[];
    rows.forEach((row,i)=>row.forEach((v,j)=>{ const r=a0+i,c=b0+j; if(r<R&&c<C&&!isNaN(v)) list.push({a:at(r,c),w:1,v:toRaw(t,v)}); }));
    if(applyEdits(list,`${t.id}: вставка`)) toast(`Вставлено значений: ${list.length}`);
  });
  sc.append(tb); wrap.append(sc);
  const lg=document.createElement("div"); lg.className="legend";
  lg.innerHTML=`<span class="mono">${disp(t,lo)}</span><span class="ramp" style="background:linear-gradient(90deg,${[0,.25,.5,.75,1].map(f=>heat(lo+(hi-lo)*f,lo,hi)).join(",")})"></span><span class="mono">${disp(t,hi)}</span>

/* ---------- 1D point tables ---------- */
function xLabel(t,x,w){
  if(t.x==="RPMb" && w===1) return `${x} (${rpmB(x)} об/мин)`;
  if(t.x==="ECT" && w===1) return `${x} (≈${Math.round(ectC(x))} °C)`;

function editableCell(td,get,set,label){
  td.className="ed"; td.tabIndex=0;
  const show=()=>{ td.innerHTML=""; const s=document.createElement("span"); s.textContent=get(); td.append(s); };
  show();
  const start=()=>{ if(td.querySelector("input")) return; const inp=document.createElement("input"); inp.type="text"; inp.inputMode="numeric"; inp.value=get(); inp.setAttribute("aria-label",label);
    td.innerHTML=""; td.append(inp); inp.focus(); inp.select(); let done=false;
    const fin=ok=>{ if(done) return; done=true; const v=parseFloat(inp.value.replace(",",".")); if(ok && !isNaN(v)) { if(!set(v)) show(); } else show(); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); fin(true);} if(e.key==="Escape"){ e.preventDefault(); fin(false);} };
    inp.onblur=()=>fin(true); };
  td.onclick=start; td.onkeydown=e=>{ if(e.key==="Enter"||/^[0-9.]$/.test(e.key)){ e.preventDefault(); start(); if(/^[0-9.]$/.test(e.key)){ const i=td.querySelector("input"); i.value=e.key; } } };
}

function lineChart(cur,ref,orig,xfmt){
  const box=document.createElement("div"); box.className="chart";
  const all=[...cur,...(ref||[]),...orig];
  const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  let x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  if(x1===x0) x1=x0+1; if(y1===y0){ y1+=1; y0-=1; }
  const W=560,H=260,ml=52,mr=14,mt=12,mb=34;
  const X=x=>ml+(x-x0)/(x1-x0)*(W-ml-mr), Y=y=>mt+(1-(y-y0)/(y1-y0))*(H-mt-mb);
  const path=pts=>[...pts].sort((a,b)=>a[0]-b[0]).map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  let g=""; for(let i=0;i<=4;i++){ const yv=y0+(y1-y0)*i/4, yy=Y(yv); g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(yv)}</text>`; }
  for(let i=0;i<=4;i++){ const xv=x0+(x1-x0)*i/4; g+=`<text x="${X(xv)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--muted)">${xfmt?xfmt(Math.round(xv)):Math.round(xv)}</text>`; }
  const dots=cur.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.2" fill="var(--accent)"/>`).join("");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График таблицы" font-family="JetBrains Mono, monospace">${g}
    <path d="${path(orig)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>
    ${ref?`<path d="${path(ref)}" fill="none" stroke="var(--ref)" stroke-width="1.5"/>`:""}
    <path d="${path(cur)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${dots}</svg>
    <div class="legend"><span style="color:var(--accent)">━ текущее</span><span>┄ исходное</span>${ref?`<span style="color:var(--ref)">━ эталон</span>`:""}${xfmt?"<span>ось x — об/мин</span>":""}</div>`;
  return box;
}

/* ---------- download ---------- */
function crc32(buf){ let c,crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++){ c=(crc^buf[i])&255; for(let k=0;k<8;k++) c=c&1?(c>>>1)^0xEDB88320:c>>>1; crc=(crc>>>8)^c; } return (crc^0xFFFFFFFF)>>>0; }
function zipOne(name,data){
  const enc=new TextEncoder().encode(name), crc=crc32(data), d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(8,0,true); lh.setUint16(10,time,true); lh.setUint16(12,date,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,enc.length,true);
  const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(12,time,true); ch.setUint16(14,date,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,enc.length,true);
  const cdOff=30+enc.length+data.length, cdLen=46+enc.length;
  const ed=new DataView(new ArrayBuffer(22)); ed.setUint32(0,0x06054b50,true); ed.setUint16(8,1,true); ed.setUint16(10,1,true); ed.setUint32(12,cdLen,true); ed.setUint32(16,cdOff,true);
  return new Blob([lh,enc,data,ch,enc,ed],{type:"application/zip"});
}
function outName(){ const b=S.name.replace(/\.[^.]*$/,""); return b+"_edit.bin"; }
async function save(){
  if(!S.cur) return;
  const out=new Uint8Array(S.cur);
  const s=sum(out);
  if(s!==0 && S.fixCk){ out[CKSUM_FIX]=(out[CKSUM_FIX]-s+256)&255; }
  const name=outName();
  const url=URL.createObjectURL(new Blob([out],{type:"application/octet-stream"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(`Скачано: ${name}${s!==0&&S.fixCk?" — сумма исправлена байтом 0x3A":""}`);
}

/* ---------- misc ---------- */
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }
function refresh(){ renderHeader(); renderList(); renderPane(); }

$("#fileIn").onchange=e=>{ if(e.target.files[0]) loadMain(e.target.files[0]); e.target.value=""; };
$("#refIn").onchange=e=>{ if(!S.cur){ toast("Сначала откройте основную прошивку"); e.target.value=""; return; } if(e.target.files[0]) loadRef(e.target.files[0]); e.target.value=""; };
$("#undoBtn").onclick=undo; $("#redoBtn").onclick=redo; $("#saveBtn").onclick=save;
$("#q").oninput=e=>{ S.q=e.target.value; renderList(); };
$("#expAll").onclick=()=>{ S.collapsed.clear(); saveCollapsed(); renderList(); };
$("#colAll").onclick=()=>{ for(const t of CATALOG) S.collapsed.add(t.lg); saveCollapsed(); renderList(); };
document.querySelectorAll("#filters .chip").forEach(b=>b.onclick=()=>{ const f=b.dataset.f; if(S.filters.has(f)) S.filters.delete(f); else S.filters.add(f); b.setAttribute("aria-pressed",S.filters.has(f)); renderList(); });
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); } if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); } });
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); const d=$("#drop"); if(d) d.classList.add("over"); }));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{ const d=$("#drop"); if(d) d.classList.remove("over"); }));
document.addEventListener("drop",e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) loadMain(f); });
window.addEventListener("beforeunload",e=>{ if(S.undo.length){ e.preventDefault(); e.returnValue=""; } });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>S.cur&&renderPane());

S.sel="63F8";
refresh();
</script>
